[package]
name = "varde-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "varde-agent"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
base64 = "0.22"
clap.workspace = true
agent-ipc = { path = "../../crates/agent-ipc", features = ["server"] }
cp-api = { path = "../../crates/cp-api" }
ed25519-dalek.workspace = true
executor-api = { path = "../../crates/executor-api" }
executor-native = { path = "../../crates/executor-native" }
game-driver-api = { path = "../../crates/game-driver-api" }
game-minecraft = { path = "../../games/minecraft" }
game-testgame = { path = "../../games/testgame" }
game-valheim = { path = "../../games/valheim" }
hex.workspace = true
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto"] }
mesh-ipc = { path = "../../crates/mesh-ipc" }
rand.workspace = true
runtimes = { path = "../../crates/runtimes" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
snapshot-store = { path = "../../crates/snapshot-store" }
tokio.workspace = true
tokio-stream = "0.1"
toml = "0.8"
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[dev-dependencies]
tempfile = "3"
