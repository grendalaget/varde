[workspace]
resolver = "2"
members = [
    "apps/agent",
    "crates/game-driver-api",
    "crates/executor-api",
    "crates/snapshot-store",
    "crates/mesh-ipc",
    "crates/agent-ipc",
    "apps/desktop",
    "crates/executor-native",
    "crates/cp-api",
    "crates/runtimes",
    "games/testgame",
    "games/minecraft",
    "games/valheim",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
tonic-build = "0.12"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
protoc-bin-vendored = "3"
hyper-util = { version = "0.1", features = ["tokio"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }

[profile.release]
lto = true
