openapi: 3.1.0
info:
  title: p2pgames control plane
  version: "0.1.0"
  description: >
    Public HTTP API for the p2pgames control plane. The web dashboard and
    CLI are the only intended clients; peers never call this API.
  license:
    name: MIT
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness probe
      tags: [meta]
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /v1/version:
    get:
      operationId: getVersion
      summary: Control-plane build version
      tags: [meta]
      responses:
        "200":
          description: Version string.
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    type: string
                    example: "0.1.0"
