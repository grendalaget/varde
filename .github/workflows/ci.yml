name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      # install golangci-lint once and run it per module: the action's
      # default run at the workspace root trips on go.work
      - uses: golangci/golangci-lint-action@v7
        with:
          install-mode: binary
          skip-cache: true
          working-directory: go
      - name: webui placeholder (for go:embed)
        shell: bash
        run: |
          mkdir -p apps/controlplane/internal/webui/dist
          cp apps/controlplane/internal/webui/placeholder.html \
            apps/controlplane/internal/webui/dist/index.html
      - name: lint
        shell: bash
        run: |
          LINT=$(find "$RUNNER_WORK_SPACE" -name golangci-lint -type f 2>/dev/null | head -1)
          [ -n "$LINT" ] || LINT=golangci-lint
          for m in go apps/controlplane apps/relay apps/mesh; do
            (cd $m && "$LINT" run ./...) || exit 1
          done
        env:
          RUNNER_WORK_SPACE: ${{ github.workspace }}/..
      # services: containers are Linux-only; run postgres via docker on the
      # ubuntu leg so the windows leg can share this job
      - name: postgres (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_USER=varde -e POSTGRES_PASSWORD=varde \
            -e POSTGRES_DB=varde_test postgres:16
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U varde >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "postgres did not become ready"; exit 1
      - name: vet
        run: |
          for m in go apps/controlplane apps/relay apps/mesh; do
            (cd $m && go vet ./...) || exit 1
          done
        shell: bash
      - name: test
        run: |
          RACE=""
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            RACE="-race"
            # postgres only runs on the linux leg
            export VARDE_TEST_POSTGRES_URL=postgres://varde:varde@localhost:5432/varde_test?sslmode=disable
          fi
          for m in go apps/controlplane apps/relay apps/mesh; do
            (cd $m && go test $RACE ./...) || exit 1
          done
        shell: bash

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace -- -D warnings
      - name: test
        run: cargo test --workspace

  web:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: bun
      - run: bun install --frozen-lockfile
      - run: bun run --filter "@varde/web" lint
      - run: bun run --filter "@varde/web" typecheck
      - run: bun run --filter "@varde/web" build
      - run: bun run --filter "@varde/desktop-ui" lint
      - run: bun run --filter "@varde/desktop-ui" typecheck
      - run: bun run --filter "@varde/desktop-ui" build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: buf lint
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: bun
      - run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      - run: bun install --frozen-lockfile
      - run: bun add --cwd apps/web -d openapi-typescript
      - name: check generated files are up to date
        run: |
          buf generate
          bun run --filter "@varde/web" gen:api
          git diff --exit-code -- go/gen apps/web/src/api/schema.d.ts

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          override: true
      # the tray embeds the desktop UI at compile time (frontendDist)
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: bun
      - run: bun install --frozen-lockfile
      - run: bun run --filter "@varde/desktop-ui" build
      - name: build agent + mesh + tray + control plane (MSVC)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packaging/windows/dist | Out-Null
          cargo build --release -p varde-agent -p varde-tray
          cd apps/mesh
          go build -o ../../packaging/windows/dist/varde-mesh.exe .
          cd ../..
          # the opt-in installer component ships varde-control-plane.exe
          bun run --filter "@varde/web" build
          Remove-Item -Recurse -Force apps/controlplane/internal/webui/dist -ErrorAction SilentlyContinue
          Copy-Item -Recurse apps/web/dist apps/controlplane/internal/webui/dist
          cd apps/controlplane
          go build -o ../../packaging/windows/dist/varde-control-plane.exe .
          cd ../..
          Copy-Item target/release/varde-agent.exe packaging/windows/dist/
          Copy-Item target/release/varde-tray.exe packaging/windows/dist/
      - name: WebView2 bootstrapper
        shell: pwsh
        run: |
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" `
            -OutFile packaging/windows/dist/MicrosoftEdgeWebview2Setup.exe
      - name: build installer (Tauri NSIS)
        shell: pwsh
        run: |
          $payload = 'apps/desktop/payload'
          New-Item -ItemType Directory -Force $payload | Out-Null
          Copy-Item packaging/windows/dist/varde-agent.exe, `
            packaging/windows/dist/varde-mesh.exe, `
            packaging/windows/dist/varde-control-plane.exe, `
            packaging/windows/varde.ico, LICENSE $payload/
          bunx tauri bundle --config apps/desktop/tauri.bundler.conf.json --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw 'tauri bundle failed' }
          # ref_name is e.g. "1/merge" on PRs; sanitize for the filename
          $ver = "${{ github.ref_name }}" -replace '[^0-9A-Za-z._-]','-'
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName "packaging/windows/dist/VardeSetup-$ver.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: VardeSetup
          path: packaging/windows/dist/VardeSetup-*.exe
