name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: varde
          POSTGRES_PASSWORD: varde
          POSTGRES_DB: varde_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U varde" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - uses: golangci/golangci-lint-action@v7
      - name: vet
        run: |
          for m in go apps/control-plane apps/relay apps/mesh; do
            (cd $m && go vet ./...) || exit 1
          done
        shell: bash
      - name: test
        env:
          VARDE_TEST_POSTGRES_URL: postgres://varde:varde@localhost:5432/varde_test?sslmode=disable
        run: |
          RACE=""
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then RACE="-race"; fi
          for m in go apps/control-plane apps/relay apps/mesh; do
            (cd $m && go test $RACE ./...) || exit 1
          done
        shell: bash

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace -- -D warnings
      - name: test
        run: cargo test --workspace

  web:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: buf lint
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web add -D openapi-typescript
      - name: check generated files are up to date
        run: |
          buf generate
          pnpm --dir apps/web gen:api
          git diff --exit-code -- go/gen apps/web/src/api/schema.d.ts

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          override: true
      - name: build agent + mesh (MSVC)
        shell: pwsh
        run: |
          cargo build --release -p varde-agent
          cd apps/mesh
          go build -o ../../packaging/windows/dist/varde-mesh.exe .
          cd ../..
          Copy-Item target/release/varde-agent.exe packaging/windows/dist/
      - name: Inno Setup
        run: choco install innosetup -y
      - name: build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DVersion="${{ github.ref_name }}" `
            packaging/windows/varde-agent.iss
      - uses: actions/upload-artifact@v4
        with:
          name: VardeSetup
          path: packaging/windows/dist/VardeSetup-*.exe
