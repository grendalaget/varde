name: nightly binaries

on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build/sign only; do not move the nightly tag or publish assets
        type: boolean
        default: true

permissions: {}

concurrency:
  group: nightly-binaries
  cancel-in-progress: false

jobs:
  prepare:
    # A manually selected feature branch may only run in dry-run mode.
    if: github.ref == 'refs/heads/main' || inputs.dry_run
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.source.outputs.ref }}
      version: ${{ steps.source.outputs.version }}
      changed: ${{ steps.source.outputs.changed }}
      signing: ${{ steps.source.outputs.signing }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          AZURE_TSA_ENDPOINT: ${{ vars.AZURE_TSA_ENDPOINT }}
          AZURE_TSA_ACCOUNT: ${{ vars.AZURE_TSA_ACCOUNT }}
          AZURE_TSA_CERT_PROFILE: ${{ vars.AZURE_TSA_CERT_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          sha=$(git rev-parse HEAD)
          echo "ref=$sha" >> "$GITHUB_OUTPUT"
          echo "version=0.0.0-nightly.$(date -u +%Y%m%d)+${sha:0:7}" >> "$GITHUB_OUTPUT"
          # Signing state changes which bytes the assets contain but not their
          # names, so it must trigger a rebuild on its own once configured.
          # Mirrors build-release.yml's detect step: signing only counts as
          # active once the full Azure config (secrets + vars) is present,
          # so adding the secret last still flips the marker and rebuilds.
          signing=none
          if [[ -n "$AZURE_TSA_ENDPOINT" && -n "$AZURE_TSA_ACCOUNT" && \
                -n "$AZURE_TSA_CERT_PROFILE" && -n "$AZURE_CLIENT_ID" ]]; then
            signing=azure
          fi
          if [[ "$signing" != none ]]; then
            # The signed bytes also change with the certificate profile and
            # account configuration, so fingerprint those into the marker.
            fp=$(printf '%s\n' "$AZURE_TSA_ENDPOINT" "$AZURE_TSA_ACCOUNT" \
                   "$AZURE_TSA_CERT_PROFILE" | sha256sum | cut -c1-8)
            signing=$signing-$fp
          fi
          echo "signing=$signing" >> "$GITHUB_OUTPUT"
          if [[ "$DRY_RUN" != true ]]; then
            if gh release view nightly --json body,assets > nightly.json 2> api.err; then
              if jq -e --arg marker "<!-- nightly-commit:$sha -->" \
                     --arg smarker "<!-- nightly-signing:$signing -->" \
                '(.body | contains($marker)) and (.body | contains($smarker)) and (
                  (.body | capture("<!-- nightly-assets:(?<names>\\[[^\\r\\n]*\\]) -->").names | fromjson) as $expected |
                  ($expected | length > 0) and
                  (($expected | sort) == ([.assets[].name] | sort))
                )' nightly.json >/dev/null; then
                echo 'changed=false' >> "$GITHUB_OUTPUT"
                echo 'Main is unchanged since the last successful nightly; skipped.' >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            elif ! grep -qiE 'HTTP 404|release not found' api.err; then
              cat api.err >&2; exit 1
            fi
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
      actions: read
    uses: ./.github/workflows/build-release.yml
    secrets: inherit
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      version: ${{ needs.prepare.outputs.version }}
      channel: nightly
      dry_run: ${{ inputs.dry_run || false }}

  upload:
    needs: [prepare, build]
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      version: ${{ needs.prepare.outputs.version }}
      channel: nightly
      tag: nightly
      signing: ${{ needs.prepare.outputs.signing }}
