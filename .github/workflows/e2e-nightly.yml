# Scheduled workflows only run from the default branch (main).
name: e2e nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: Minutes to run the Minecraft soak (0 disables it)
        required: false
        type: string
        default: "0"
      valheim:
        description: Run the Valheim real-game scenarios
        required: false
        type: boolean
        default: false

concurrency:
  group: e2e-nightly
  cancel-in-progress: false

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VARDE_E2E_LOG_DIR: ${{ github.workspace }}/e2e-logs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/varde-e2e-runtimes
          key: varde-e2e-runtimes-${{ runner.os }}-${{ hashFiles('crates/runtimes/src/**', 'apps/controlplane/internal/catalog/**') }}
          restore-keys: |
            varde-e2e-runtimes-${{ runner.os }}-
      - name: Run Minecraft e2e
        shell: bash
        run: |
          set -o pipefail
          make e2e-minecraft VARDE_E2E_RUNTIME_SEED="$HOME/.cache/varde-e2e-runtimes" 2>&1 | tee e2e-minecraft.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-minecraft
          path: |
            e2e-minecraft.log
            e2e-logs/
          if-no-files-found: warn

  soak:
    if: github.event_name == 'workflow_dispatch' && inputs.soak_minutes != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      VARDE_E2E_LOG_DIR: ${{ github.workspace }}/e2e-logs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/varde-e2e-runtimes
          key: varde-e2e-runtimes-${{ runner.os }}-${{ hashFiles('crates/runtimes/src/**', 'apps/controlplane/internal/catalog/**') }}
          restore-keys: |
            varde-e2e-runtimes-${{ runner.os }}-
      - name: Run Minecraft soak
        shell: bash
        env:
          SOAK_MINUTES: ${{ inputs.soak_minutes }}
        run: |
          set -o pipefail
          make e2e-soak SOAK_MINUTES="$SOAK_MINUTES" VARDE_E2E_RUNTIME_SEED="$HOME/.cache/varde-e2e-runtimes" 2>&1 | tee e2e-soak.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-soak
          path: |
            e2e-soak.log
            e2e-logs/
          if-no-files-found: warn

  valheim:
    if: github.event_name == 'workflow_dispatch' && inputs.valheim
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VARDE_E2E_LOG_DIR: ${{ github.workspace }}/e2e-logs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/varde-e2e-runtimes
          key: varde-e2e-runtimes-${{ runner.os }}-${{ hashFiles('crates/runtimes/src/**', 'apps/controlplane/internal/catalog/**') }}
          restore-keys: |
            varde-e2e-runtimes-${{ runner.os }}-
      - name: Install Valheim libraries
        run: sudo apt-get install -y libatomic1 libpulse0
      - name: Run Valheim e2e
        shell: bash
        run: |
          set -o pipefail
          make e2e-valheim VARDE_E2E_RUNTIME_SEED="$HOME/.cache/varde-e2e-runtimes" 2>&1 | tee e2e-valheim.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-valheim
          path: |
            e2e-valheim.log
            e2e-logs/
          if-no-files-found: warn
