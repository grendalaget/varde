name: build release assets

on:
  workflow_call:
    inputs:
      ref:
        description: Immutable source commit to build
        required: true
        type: string
      version:
        required: true
        type: string
      channel:
        required: true
        type: string
      dry_run:
        type: boolean
        default: true

permissions: {}

jobs:
  build:
    name: build (${{ matrix.goos }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Stable OIDC subject (repo:…:environment:release) for the Azure
    # federated credential, whatever caller/ref spawned the build.
    environment: release
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            arch: arm64
          - runner: windows-latest
            goos: windows
            arch: amd64
          - runner: macos-15
            goos: darwin
            arch: arm64
          - runner: macos-15-intel
            goos: darwin
            arch: amd64
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version }}
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.arch }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: '**/go.sum'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.goos }}-${{ matrix.arch }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Embed production web UI
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir apps/web build
          pnpm --dir apps/desktop/ui build
          make webui-dist
      - name: Set binary versions
        run: python packaging/release/version.py
      - name: Build release binaries
        run: |
          mkdir -p dist release-assets
          crates=(-p varde-agent)
          suffix=''
          if [[ "$GOOS" == windows ]]; then
            crates+=(-p varde-tray)
            suffix='.exe'
          fi
          cargo build --locked --release "${crates[@]}"
          cp "target/release/varde-agent$suffix" dist/
          if [[ "$GOOS" == windows ]]; then
            cp target/release/varde-tray.exe dist/
          fi
          for component in controlplane relay mesh; do
            name="$component"
            if [[ "$component" == controlplane ]]; then name=control-plane; fi
            (cd "apps/$component" && go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "../../dist/varde-$name$suffix" .)
          done
          cp LICENSE dist/
      - name: Detect signing configuration
        id: signing
        env:
          CHANNEL: ${{ inputs.channel }}
          AZURE_TSA_ENDPOINT: ${{ vars.AZURE_TSA_ENDPOINT }}
          AZURE_TSA_ACCOUNT: ${{ vars.AZURE_TSA_ACCOUNT }}
          AZURE_TSA_CERT_PROFILE: ${{ vars.AZURE_TSA_CERT_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          provider=none
          if [[ "$CHANNEL" == dry-run ]]; then
            : # Authenticode signing never runs on dry-run builds
          elif [[ -n "$AZURE_TSA_ENDPOINT" && -n "$AZURE_TSA_ACCOUNT" && \
                  -n "$AZURE_TSA_CERT_PROFILE" && -n "$AZURE_CLIENT_ID" ]]; then
            provider=azure
          elif [[ "$GOOS" == windows ]]; then
            echo 'Authenticode signing skipped: Azure Artifact Signing not configured (packaging/windows/README.md).' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
      - name: Sign in to Azure
        if: runner.os == 'Windows' && steps.signing.outputs.provider == 'azure'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Windows executables via Azure Artifact Signing
        if: runner.os == 'Windows' && steps.signing.outputs.provider == 'azure'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_TSA_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_TSA_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_TSA_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify signed executables
        if: runner.os == 'Windows' && steps.signing.outputs.provider == 'azure'
        shell: pwsh
        run: |
          Get-ChildItem dist/varde-*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            if ($sig.Status -ne 'Valid') { throw "signature check failed: $($_.Name) is $($sig.Status)" }
            Write-Host "$($_.Name): signed by $($sig.SignerCertificate.Subject)"
          }
      - name: Validate macOS mesh lifetime and agent launch contract
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: '1'
        run: |
          (cd apps/mesh && go test -race -count=1 -run '^TestParent' ./...)
          cargo test --locked -p varde-agent mesh_child::tests
      - name: Windows installer prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packaging/windows/dist | Out-Null
          Copy-Item dist/varde-*.exe packaging/windows/dist/
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' `
            -OutFile packaging/windows/dist/MicrosoftEdgeWebview2Setup.exe
          choco install innosetup -y
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' /DVersion="$env:VERSION" packaging/windows/varde-agent.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed' }
      - name: Sign Windows installer via Azure Artifact Signing
        if: runner.os == 'Windows' && steps.signing.outputs.provider == 'azure'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_TSA_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_TSA_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_TSA_CERT_PROFILE }}
          files: ${{ github.workspace }}\packaging\windows\dist\VardeSetup-${{ env.VERSION }}.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify signed installer
        if: runner.os == 'Windows' && steps.signing.outputs.provider == 'azure'
        shell: pwsh
        run: |
          $installer = Get-ChildItem packaging/windows/dist/VardeSetup-*.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $installer.FullName
          if ($sig.Status -ne 'Valid') { throw "signature check failed: $($installer.Name) is $($sig.Status)" }
          Write-Host "$($installer.Name): signed by $($sig.SignerCertificate.Subject)"
      - name: Package Windows assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item packaging/windows/dist/VardeSetup-*.exe release-assets/
      - name: Install nfpm
        if: runner.os == 'Linux'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
      - name: Install snapcraft
        if: runner.os == 'Linux'
        run: sudo snap install snapcraft --classic
      - name: Package Unix assets
        if: runner.os != 'Windows'
        run: bash packaging/release/package-unix.sh
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/*
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.goos }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  sign:
    name: checksums and keyless signatures
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: release-assets
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: release-assets
        run: sha256sum -- * > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/SHA256SUMS
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.5.2
      - name: Sign and verify every asset, including SHA256SUMS
        env:
          CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/build-release.yml@${{ github.ref }}
        run: |
          for asset in release-assets/*; do
            cosign sign-blob --yes --bundle "$asset.sigstore.json" "$asset"
            cosign verify-blob --bundle "$asset.sigstore.json" \
              --certificate-identity "$CERT_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$asset"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
      - name: Dry-run summary
        if: inputs.dry_run
        run: echo 'Dry run complete. All platforms built, attested and keyless-signed; no release or tag changed.' >> "$GITHUB_STEP_SUMMARY"
