name: build release assets

on:
  workflow_call:
    inputs:
      ref:
        description: Immutable source commit to build
        required: true
        type: string
      version:
        required: true
        type: string
      channel:
        required: true
        type: string
      dry_run:
        type: boolean
        default: true

permissions: {}

jobs:
  build:
    name: build (${{ matrix.goos }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Stable OIDC subject (repo:…:environment:release) for the Azure
    # federated credential, whatever caller/ref spawned the build.
    environment: release
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            arch: arm64
          - runner: windows-latest
            goos: windows
            arch: amd64
          - runner: macos-15
            goos: darwin
            arch: arm64
          - runner: macos-15-intel
            goos: darwin
            arch: amd64
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version }}
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.arch }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: '**/go.sum'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.goos }}-${{ matrix.arch }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Embed production web UI
        run: |
          bun install --frozen-lockfile
          bun run --filter "@varde/web" build
          bun run --filter "@varde/desktop-ui" build
          make webui-dist
      - name: Set binary versions
        run: python packaging/release/version.py
      - name: Build release binaries
        run: |
          mkdir -p dist release-assets
          crates=(-p varde-agent)
          suffix=''
          if [[ "$GOOS" == windows ]]; then
            suffix='.exe'
          fi
          if [[ "$GOOS" == windows || "$GOOS" == darwin ]]; then
            crates+=(-p varde-tray)
          fi
          cargo build --locked --release "${crates[@]}"
          cp "target/release/varde-agent$suffix" dist/
          if [[ "$GOOS" == windows || "$GOOS" == darwin ]]; then
            cp "target/release/varde-tray$suffix" dist/
          fi
          for component in controlplane relay mesh; do
            name="$component"
            if [[ "$component" == controlplane ]]; then name=control-plane; fi
            (cd "apps/$component" && go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "../../dist/varde-$name$suffix" .)
          done
          cp LICENSE dist/
      - name: Detect signing configuration
        id: signing
        env:
          CHANNEL: ${{ inputs.channel }}
          AZURE_TSA_ENDPOINT: ${{ vars.AZURE_TSA_ENDPOINT }}
          AZURE_TSA_ACCOUNT: ${{ vars.AZURE_TSA_ACCOUNT }}
          AZURE_TSA_CERT_PROFILE: ${{ vars.AZURE_TSA_CERT_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          provider=none
          if [[ "$CHANNEL" == dry-run ]]; then
            : # Code signing never runs on dry-run builds
          elif [[ "$GOOS" == windows && -n "$AZURE_TSA_ENDPOINT" && \
                  -n "$AZURE_TSA_ACCOUNT" && -n "$AZURE_TSA_CERT_PROFILE" && \
                  -n "$AZURE_CLIENT_ID" ]]; then
            provider=azure
          elif [[ "$GOOS" == darwin && -n "$APPLE_TEAM_ID" && \
                  -n "$APPLE_CERTIFICATE_P12" && -n "$APPLE_CERTIFICATE_PASSWORD" && \
                  -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" && \
                  -n "$APPLE_API_KEY" ]]; then
            provider=apple
          elif [[ "$GOOS" == windows ]]; then
            echo 'Authenticode signing skipped: Azure Artifact Signing not configured (packaging/windows/README.md).' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$GOOS" == darwin ]]; then
            echo 'codesigning skipped: Apple Developer ID not configured — Varde.app is ad-hoc signed and unnotarized (packaging/macos/README.md).' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
      - name: Sign in to Azure
        if: runner.os == 'Windows' && steps.signing.outputs.provider == 'azure'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Windows executables via Azure Artifact Signing
        if: runner.os == 'Windows' && steps.signing.outputs.provider == 'azure'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_TSA_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_TSA_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_TSA_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify signed executables
        if: runner.os == 'Windows' && steps.signing.outputs.provider == 'azure'
        shell: pwsh
        run: |
          Get-ChildItem dist/varde-*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            if ($sig.Status -ne 'Valid') { throw "signature check failed: $($_.Name) is $($sig.Status)" }
            Write-Host "$($_.Name): signed by $($sig.SignerCertificate.Subject)"
          }
      - name: Validate macOS mesh lifetime and agent launch contract
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: '1'
        run: |
          (cd apps/mesh && go test -race -count=1 -run '^TestParent' ./...)
          cargo test --locked -p varde-agent mesh_child::tests
      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS' && steps.signing.outputs.provider == 'apple'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain=/tmp/varde-signing.keychain-db
          echo "$APPLE_CERTIFICATE_P12" | base64 -d > /tmp/varde-dev-id.p12
          security create-keychain -p varde-ci "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p varde-ci "$keychain"
          security import /tmp/varde-dev-id.p12 -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k varde-ci "$keychain"
          rm /tmp/varde-dev-id.p12
          security find-identity -v -p codesigning "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -m1 'Developer ID Application' | sed -E 's/.*"(.+)"/\1/')
          if [[ -z "$identity" ]]; then
            echo 'No Developer ID Application identity in APPLE_CERTIFICATE_P12' >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Build Varde.app and release DMG
        if: runner.os == 'macOS'
        run: |
          bash packaging/macos/package-app.sh
          bash packaging/macos/make-dmg.sh \
            target/release/bundle/macos/Varde.app \
            "release-assets/Varde-$VERSION-macos-$GOARCH.dmg"
      - name: Notarize and staple the release DMG
        if: runner.os == 'macOS' && steps.signing.outputs.provider == 'apple'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          printf '%s' "$APPLE_API_KEY" > /tmp/varde-AuthKey.p8
          dmg="release-assets/Varde-$VERSION-macos-$GOARCH.dmg"
          xcrun notarytool submit "$dmg" \
            --key /tmp/varde-AuthKey.p8 --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          rm /tmp/varde-AuthKey.p8
      - name: Build Windows installer (varde-setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: packaging/windows/build-setup.ps1 -Version $env:VERSION
      - name: Sign Windows installer via Azure Artifact Signing
        if: runner.os == 'Windows' && steps.signing.outputs.provider == 'azure'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_TSA_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_TSA_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_TSA_CERT_PROFILE }}
          files: ${{ github.workspace }}\release-assets\VardeSetup-${{ env.VERSION }}.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify signed installer
        if: runner.os == 'Windows' && steps.signing.outputs.provider == 'azure'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release-assets/VardeSetup-*.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $installer.FullName
          if ($sig.Status -ne 'Valid') { throw "signature check failed: $($installer.Name) is $($sig.Status)" }
          Write-Host "$($installer.Name): signed by $($sig.SignerCertificate.Subject)"
      - name: Install nfpm
        if: runner.os == 'Linux'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
      - name: Install snapcraft
        if: runner.os == 'Linux'
        run: sudo snap install snapcraft --classic
      - name: Package Unix assets
        if: runner.os != 'Windows'
        run: bash packaging/release/package-unix.sh
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/*
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.goos }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  android:
    name: build (android, arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: '**/go.sum'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-android-arm64
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        # The ubuntu runner image ships the SDK at $ANDROID_HOME (setup-android
        # v3 is broken against cmdline-tools 16). These installs are no-ops
        # while the image carries them and self-heal when it rotates.
        run: |
          sdkmanager=$(find "$ANDROID_HOME"/cmdline-tools -name sdkmanager | sort -V | tail -1)
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build arm64 agent + mesh
        run: |
          cargo install cross --locked
          make android
      - name: Assemble release APK
        run: |
          mkdir -p release-assets
          # versionCode must strictly increase per installable build — epoch
          # seconds stays monotonic across nightly/release rebuilds by
          # construction (safe until ~2037). versionName carries the version.
          (cd apps/android && ./gradlew --no-daemon assembleRelease \
            -PvardeVersionName="$VERSION" -PvardeVersionCode="$(date -u +%s)")
          "$ANDROID_HOME"/build-tools/35.0.0/zipalign -p -f 4 \
            apps/android/app/build/outputs/apk/release/app-release-unsigned.apk \
            "release-assets/Varde-$VERSION-android-unsigned.apk"
      - name: Sign APK (ANDROID_KEYSTORE_* secrets)
        if: inputs.channel != 'dry-run'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo 'ANDROID_KEYSTORE_* secrets not set — the APK ships unsigned and is not installable; see docs/android-anchor.md (CI signing).' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/anchor.jks
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner sign \
            --ks /tmp/anchor.jks --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "release-assets/Varde-$VERSION-android.apk" \
            "release-assets/Varde-$VERSION-android-unsigned.apk"
          rm /tmp/anchor.jks
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify \
            --print-certs "release-assets/Varde-$VERSION-android.apk" | head -3
          rm "release-assets/Varde-$VERSION-android-unsigned.apk"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/*
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-android-arm64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  sign:
    name: checksums and keyless signatures
    needs: [build, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: release-assets
          merge-multiple: true
      - name: Stage the curl|sh installer
        # install.sh is platform-independent; adding it here (once) puts it
        # under SHA256SUMS, the minisign and cosign steps like any payload.
        run: cp packaging/linux/install.sh release-assets/install.sh
      - name: SHA256SUMS
        working-directory: release-assets
        run: sha256sum -- * > SHA256SUMS
      # one attest step per subject: subject-path does not expand {} braces
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/install.sh
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.5.2
      - name: Sign update assets and emit latest.json
        env:
          # Repository secret (not environment-scoped): this job does not run
          # under `environment: release`, which would also change the cosign
          # OIDC subject and break CERT_IDENTITY verification.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The signer reads TAURI_SIGNING_PRIVATE_KEY[_PASSWORD] from the
          # environment; passing -f/-p alongside is a hard CLI conflict
          # ("--private-key-path cannot be used with --private-key").
          if [[ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            for asset in release-assets/*; do
              npx --yes @tauri-apps/cli@^2 signer sign "$asset"
            done
          else
            echo 'TAURI_SIGNING_PRIVATE_KEY not set: emitting an unsigned manifest; update clients will not apply these builds.' >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 packaging/release/update_manifest.py release-assets
          if [[ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            npx --yes @tauri-apps/cli@^2 signer sign release-assets/latest.json
          fi
      - name: Sign and verify every asset, including SHA256SUMS
        env:
          CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/build-release.yml@${{ github.ref }}
        run: |
          for asset in release-assets/*; do
            cosign sign-blob --yes --bundle "$asset.sigstore.json" "$asset"
            cosign verify-blob --bundle "$asset.sigstore.json" \
              --certificate-identity "$CERT_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$asset"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
      - name: Dry-run summary
        if: inputs.dry_run
        run: echo 'Dry run complete. All platforms built, attested and keyless-signed; no release or tag changed.' >> "$GITHUB_STEP_SUMMARY"
