name: Bug report
description: Report a reproducible problem with Varde.
body:
  - type: markdown
    attributes:
      value: |
        Check the [docs](https://varde.games/docs) first. For vulnerabilities, use [private reporting](https://github.com/grendalaget/varde/security/advisories/new) or email support@varde.games, not this form. Remove secrets and personal information from logs.
  - type: input
    id: version
    attributes:
      label: Varde version
      description: Include the release version or commit.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and installation method
      description: Include operating system, architecture and package or installer used.
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game and version
      description: If relevant, include the game version and any plugins.
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include enough detail to reproduce the problem on a new setup.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and additional context
      description: Include relevant redacted logs or screenshots.
