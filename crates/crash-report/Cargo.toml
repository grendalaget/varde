[package]
name = "crash-report"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Crash capture for Varde processes: panic reports, WER dumps, child stderr tails"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
filetime = "0.2"
tempfile = "3"
