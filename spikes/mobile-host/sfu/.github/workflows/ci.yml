name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Same source of truth as release.yml, so a Go bump in go.mod moves
          # both at once.
          go-version-file: go.mod
          cache: true
      # Nothing checked a pull request at all before this; the only compile check was inside
      # a workflow_dispatch release. ./... because a package no binary imports must compile.
      - run: go build ./...

      # No comment runs past two lines. The script carries the list of paths still
      # to be swept, and that list only ever shrinks.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-comment-length.mjs

      # Code here is TypeScript so its types get checked (GRYT-1800). A file that has to stay
      # JavaScript goes in .js-allowlist, one path a line, with a # comment saying why.
      - name: No new JavaScript
        run: |
          allowed=$(grep -v '^#' .js-allowlist 2>/dev/null || true)
          found=$(git ls-files '*.js' '*.mjs' '*.cjs' '*.jsx' | grep -vxF -e "$allowed" -e '' || true)
          if [ -n "$found" ]; then
            echo "::error::JavaScript not on .js-allowlist. Write it in TypeScript (GRYT-1800):"
            echo "$found"
            exit 1
          fi

      - run: go vet ./...
      # These tests existed and had never run anywhere but a developer's machine. -race
      # because every bug this package has had is a race, GRYT-32 included.
      - run: go test -race ./...
      # gofmt, checked rather than assumed: four files had drifted because nothing looked.
      # The diff is printed, so a failure says what to change.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt clean:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
