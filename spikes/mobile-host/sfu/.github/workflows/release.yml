name: Release SFU

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release Channel"
        required: true
        default: "beta"
        type: choice
        options:
          - beta
          - latest
      bump:
        description: "Version Bump Type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Custom Version, if "custom" is selected'
        required: false
        default: ""
        type: string

permissions:
  contents: write
  packages: write

env:
  RELEASE_OWNER: Gryt-chat
  RELEASE_REPO: sfu
  IMAGE: ghcr.io/gryt-chat/sfu

jobs:
  release:
    name: Release SFU
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.channel.outputs.channel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # The release gate and beta-follows-latest are TypeScript, which the runner's own Node may be too old to strip.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Git user
        shell: bash
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Determine channel
        id: channel
        shell: bash
        run: |
          set -euo pipefail

          CHANNEL="${{ github.event.inputs.channel }}"

          if [[ "$CHANNEL" != "beta" && "$CHANNEL" != "latest" ]]; then
            echo "Invalid channel: $CHANNEL"
            exit 1
          fi

          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          CHANNEL="${{ steps.channel.outputs.channel }}"

          # Tags rather than a VERSION file, since main is protected. Stable ones only, so a
          # beta never becomes the base of the next bump. fetch-depth: 0 above fetches them.
          CURRENT_VERSION="$(
            git -c versionsort.suffix=-alpha -c versionsort.suffix=-beta -c versionsort.suffix=-rc \
                tag --list 'v*' --sort=-v:refname \
              | grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' \
              | sed -n '1s/^v//p' || true
          )"

          if [[ -z "$CURRENT_VERSION" ]]; then
            echo "No stable v* tags found, so there is no version to bump from."
            echo "If this repository really has no releases yet, dispatch with"
            echo "bump=custom and an explicit version."
            exit 1
          fi

          echo "Current version from tags: $CURRENT_VERSION"

          BUMP="${{ github.event.inputs.bump }}"
          CUSTOM_VERSION="${{ github.event.inputs.custom_version }}"

          if [[ "$BUMP" == "custom" ]]; then
            if [[ -z "$CUSTOM_VERSION" ]]; then
              echo "custom_version is required when bump=custom"
              exit 1
            fi

            # Same shapes checkout-release-tag.sh in Gryt-chat/gryt sorts into each channel.
            if [[ "$CHANNEL" == "beta" ]]; then
              CUSTOM_PATTERN='^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$'
              CUSTOM_EXAMPLE="1.2.3-beta.1"
            else
              CUSTOM_PATTERN='^[0-9]+\.[0-9]+\.[0-9]+$'
              CUSTOM_EXAMPLE="1.2.3"
            fi

            if ! [[ "$CUSTOM_VERSION" =~ $CUSTOM_PATTERN ]]; then
              echo "Invalid custom version for the $CHANNEL channel: $CUSTOM_VERSION"
              echo "Expected something like $CUSTOM_EXAMPLE"
              exit 1
            fi

            NEW_VERSION="$CUSTOM_VERSION"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

            if ! [[ "$MAJOR" =~ ^[0-9]+$ && "$MINOR" =~ ^[0-9]+$ && "$PATCH" =~ ^[0-9]+$ ]]; then
              echo "Invalid current VERSION: $CURRENT_VERSION"
              exit 1
            fi

            case "$BUMP" in
              major)
                NEW_VERSION="$((MAJOR + 1)).0.0"
                ;;
              minor)
                NEW_VERSION="$MAJOR.$((MINOR + 1)).0"
                ;;
              patch)
                NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
                ;;
              *)
                echo "Invalid bump type: $BUMP"
                exit 1
                ;;
            esac

            if [[ "$CHANNEL" == "beta" ]]; then
              LAST_BETA="$(
                git tag --list "v${NEW_VERSION}-beta.*" \
                  | sed -nE "s/^v${NEW_VERSION//./\\.}-beta\.([0-9]+)$/\1/p" \
                  | sort -n \
                  | tail -n1
              )"
              NEW_VERSION="${NEW_VERSION}-beta.$(( ${LAST_BETA:-0} + 1 ))"
            fi
          fi

          if [[ "$NEW_VERSION" == "$CURRENT_VERSION" ]]; then
            echo "Version did not change: $CURRENT_VERSION"
            exit 1
          fi

          if git rev-parse "v$NEW_VERSION" >/dev/null 2>&1; then
            echo "Tag v$NEW_VERSION already exists locally."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$NEW_VERSION" >/dev/null 2>&1; then
            echo "Tag v$NEW_VERSION already exists on origin."
            exit 1
          fi

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      # The version is known and nothing is tagged yet. Without a line the site's
      # build fails and gryt.chat stops deploying (GRYT-1108).
      - name: Require a changelog line
        shell: bash
        run: |
          set -euo pipefail

          GATE="https://raw.githubusercontent.com/Gryt-chat/gryt/main/.github/scripts/check-release-line.mts"
          if ! curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/check-release-line.mts" "$GATE"; then
            echo "Could not download $GATE, so the line was not checked. Nothing is tagged yet."
            exit 1
          fi

          node "$RUNNER_TEMP/check-release-line.mts" voice "${{ steps.version.outputs.version }}"

      - name: Tag the release
        shell: bash
        run: |
          set -euo pipefail

          # Tag only. Nothing is committed, so nothing is pushed to main and this works
          # against a protected branch. The tag names the dispatched commit.
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Run go vet
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...

      - name: Build check
        shell: bash
        run: |
          set -euo pipefail
          go build -o /dev/null ./cmd/sfu

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: docker
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          CHANNEL="${{ steps.channel.outputs.channel }}"

          V_MAJOR="$(echo "$VERSION" | cut -d. -f1)"
          V_MINOR="$(echo "$VERSION" | cut -d. -f2)"

          TAGS=(
            "${IMAGE}:${VERSION}"
          )

          # A stable release moves latest-beta in the last step, and only if the beta there is older.
          if [[ "$CHANNEL" == "latest" ]]; then
            TAGS+=(
              "${IMAGE}:${V_MAJOR}.${V_MINOR}"
              "${IMAGE}:${V_MAJOR}"
              "${IMAGE}:latest"
            )
          else
            TAGS+=("${IMAGE}:latest-beta")
          fi

          ARGS=()
          for TAG in "${TAGS[@]}"; do
            ARGS+=(-t "$TAG")
          done

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$VERSION" \
            --cache-from type=registry,ref=${IMAGE}:buildcache \
            --cache-to type=registry,ref=${IMAGE}:buildcache,mode=max \
            "${ARGS[@]}" \
            --push .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Gryt SFU v${{ steps.version.outputs.version }}
          prerelease: ${{ steps.channel.outputs.channel == 'beta' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Announce the release on Discord and Gryt
        uses: Gryt-chat/.github/actions/release-notify@main
        with:
          component: SFU
          version: ${{ steps.version.outputs.version }}
          channel: ${{ steps.channel.outputs.channel }}
          repository: Gryt-chat/sfu
          tag: v${{ steps.version.outputs.version }}
          artifact-label: Docker
          artifact-value: ghcr.io/gryt-chat/sfu:${{ steps.version.outputs.version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          discord-webhook-url: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          gryt-webhook-url: ${{ secrets.GRYT_RELEASE_WEBHOOK_URL }}

      # A stable release moves latest-beta too, unless a newer beta is already there, so beta never
      # runs behind prod (GRYT-1236). Last, and gated on the push, so it can't cost the release.
      - name: Bring latest-beta up to this release
        if: ${{ !cancelled() && steps.docker.outcome == 'success' && steps.channel.outputs.channel == 'latest' }}
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="https://raw.githubusercontent.com/Gryt-chat/gryt/main/.github/scripts/beta-follows-latest.mts"
          if ! curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/beta-follows-latest.mts" "$SCRIPT"; then
            echo "Could not download $SCRIPT, so latest-beta was left where it is."
            exit 1
          fi

          TARGET="$(node "$RUNNER_TEMP/beta-follows-latest.mts" "$IMAGE" "${{ steps.version.outputs.version }}")"
          if [[ -n "$TARGET" ]]; then
            docker buildx imagetools create -t "${IMAGE}:latest-beta" "${IMAGE}@${TARGET}"
          fi
