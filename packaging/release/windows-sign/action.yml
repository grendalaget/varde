name: Authenticode signing
description: Single provider adapter shared by the binary and installer signing steps
inputs:
  path:
    description: Wildcard selecting the files to sign
    required: true
runs:
  using: composite
  steps:
    - shell: pwsh
      env:
        SIGN_PATH: ${{ inputs.path }}
      run: |
        if (!$env:WINDOWS_CERT_PFX_BASE64 -or !$env:WINDOWS_CERT_PASSWORD) {
          Write-Output "::warning::WINDOWS_CERT_PFX_BASE64 or WINDOWS_CERT_PASSWORD absent: skipping Authenticode signing."
          exit 0
        }
        $ErrorActionPreference = 'Stop'
        $cert = Join-Path $env:RUNNER_TEMP 'varde-signing.pfx'
        try {
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (!$signtool) { throw 'Windows SDK signtool.exe not found' }
          $files = @(Get-ChildItem $env:SIGN_PATH -File)
          if (!$files.Count) { throw 'No files matched the signing path' }
          foreach ($file in $files) {
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
              /f $cert /p $env:WINDOWS_CERT_PASSWORD $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed: $($file.Name)" }
            & $signtool.FullName verify /pa $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed: $($file.Name)" }
          }
        } finally {
          Remove-Item $cert -Force -ErrorAction SilentlyContinue
        }
