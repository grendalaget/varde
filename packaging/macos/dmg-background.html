<!doctype html>
<!--
  Varde DMG backdrop: a snapshot of the varde.games hero — the monospace
  glyph field lit by drifting noise "clouds", drawing the cairn itself
  (Tåke stones, Glød host). Ported verbatim from varde-cloud's
  src/components/ascii-clouds.tsx, minus interactivity: no ripples, no
  animation loop — a single frame at a fixed u_time so every build renders
  the identical backdrop. Rendered at 2x by make-dmg.sh (headless Chrome);
  dmg-background.svg is the degraded no-Chrome fallback for qlmanage.

  Icon anchors in appdmg.json: (132,196) and (408,196); the arrow sits on
  the icon row's centerline.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 540px; height: 360px; overflow: hidden; }
  body {
    position: relative;
    /* same field the hero sits on: Natt base + the two radial washes */
    background: oklch(16% 0.0093 37.96);
  }
  .wash {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 70% 20%, rgba(255,91,31,0.05), transparent 70%),
      radial-gradient(ellipse 50% 40% at 20% 80%, rgba(56,49,47,0.35), transparent 70%);
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* crisp white-variant logomark over the glyph field — at DMG size the
     glyph-drawn cairn is too coarse to read, so the field stays clouds-only */
  #mark { position: absolute; left: 222px; top: 24px; width: 96px; height: 96px; }
  .chrome { position: absolute; inset: 0; }
  .caption {
    position: absolute; left: 0; right: 0; top: 318px; text-align: center;
    font: 13px/1.4 -apple-system, "Helvetica Neue", sans-serif;
    color: #8a8179;
  }
</style>
</head>
<body>
<div class="wash"></div>
<canvas id="field"></canvas>
<div id="mark"><svg viewBox="0 0 512 512" width="96" height="96" aria-hidden="true"><path fill="#DCE2E6" d="M56.95 447.32L62.25 401.83C62.43 400.35 62.87 399.11 63.68 397.85L95.15 348.75C96.97 345.92 99.71 344.42 103.07 344.43L438.68 344.91C443 344.92 446.14 347.7 446.66 351.99L455.08 421.26C455.45 424.29 454.52 426.94 452.35 429.08L436.42 444.79C434.16 447.01 431.52 448.14 428.36 448.25L69.36 460.79C61.42 461.07 56.03 455.21 56.95 447.32ZM105.24 311.6L113.38 265.6C114.07 261.69 116.94 259.16 120.91 258.96L396.3 245.29C399.7 245.12 402.53 246.51 404.48 249.3L432.8 289.97C433.69 291.25 434.19 292.55 434.4 294.09L436.88 312.55C437.92 320.33 432.74 326.24 424.89 326.23L117.11 325.78C109.04 325.77 103.84 319.55 105.24 311.6ZM129.79 225.4L134.37 194.26C134.56 192.97 134.95 191.88 135.62 190.76L157.96 153.81C159.66 151.01 162.26 149.45 165.53 149.29L245.72 145.31C250.46 145.07 253.92 148.21 254.16 152.95L257.56 221.4C257.91 228.51 253.2 233.71 246.1 234.06L142.34 239.21C134.15 239.62 128.6 233.51 129.79 225.4ZM184.38 114.89L186.94 100.39C187.14 99.26 187.49 98.3 188.06 97.31L206.36 65.76C207.93 63.05 210.35 61.48 213.46 61.13L303.44 51.27C306.84 50.89 309.77 52.13 311.87 54.83L342.79 94.49C343.34 95.18 343.73 95.86 344.07 96.68L349.1 108.88C351.81 115.43 347.93 121.55 340.85 121.9L196.87 129.05C188.52 129.46 182.93 123.13 184.38 114.89Z"/><path fill="#FF5B1F" d="M276.4 220.47L273 152.01C272.76 147.28 275.9 143.81 280.64 143.57L366.65 139.3C369.92 139.14 372.67 140.43 374.63 143.05L397.92 174.13C398.77 175.27 399.29 176.42 399.59 177.81L406.87 212.06C408.54 219.88 403.64 226.24 395.66 226.63L289.05 231.93C281.95 232.28 276.75 227.57 276.4 220.47Z"/></svg></div>
<svg class="chrome" width="540" height="360" viewBox="0 0 540 360">
  <g stroke="#FF5B1F" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M196 196 H338"/>
    <path d="M322 180 L346 196 L322 212"/>
  </g>
</svg>
<div class="caption">Drag Varde to Applications</div>
<script>
"use strict";

/* ---- verbatim port of ascii-clouds.tsx (varde-cloud) ---- */
const CELL = 10;
const DPR_MAX = 2;
const MONO = `ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace`;
const GLYPHS = [
  " ", "·", ":", "-", "~", "=", "+", "*",
  "x", "o", "a", "s", "c", "e", "%", "@",
];
const RUNE_SLOTS = [[9, "ᚠ"], [11, "ᚱ"], [13, "ᛋ"]];

const VERT = `#version 300 es
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const FRAG = `#version 300 es
precision highp float;
out vec4 fragColor;

uniform vec2  u_res;                          // canvas size, device px
uniform float u_time;                         // seconds
uniform float u_cell;                         // cell size, device px
uniform sampler2D u_atlas;                    // R8 glyph strip
uniform int   u_atlasN;
uniform vec4  u_mark;                         // x,y,w,h device px, y from bottom
uniform sampler2D u_markTex;                  // r = stones, g = host stone
uniform vec3  u_colBase;
uniform vec3  u_colPeak;
uniform vec3  u_colGlod;

float hash21(vec2 p) {
  p = fract(p * vec2(234.34, 435.345));
  p += dot(p, p + 34.23);
  return fract(p.x * p.y);
}

float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(hash21(i), hash21(i + vec2(1, 0)), u.x),
    mix(hash21(i + vec2(0, 1)), hash21(i + vec2(1, 1)), u.x),
    u.y);
}

float fbm(vec2 p) {
  return 0.55 * vnoise(p)
       + 0.30 * vnoise(p * 2.03 + 11.3)
       + 0.15 * vnoise(p * 4.07 + 27.7);
}

void main() {
  vec2 frag = gl_FragCoord.xy;
  vec2 cid  = floor(frag / u_cell);
  vec2 cuv  = fract(frag / u_cell);
  float t   = u_time;

  /* Cloud field: slow drift through domain-warped value noise. */
  vec2 q = cid * 0.053;
  vec2 warp = vec2(
    vnoise(q * 0.7 + vec2(t * 0.050, 0.0)),
    vnoise(q * 0.7 + vec2(0.0, t * 0.040) + 19.7));
  float v = fbm(q + warp * 0.9 + vec2(t * 0.100, t * 0.042));
  v = clamp(v + (hash21(cid) - 0.5) * 0.18, 0.0, 1.0);

  /* Mark mask: inside the cairn the field is always lit — Tåke stones,
   * Glød host — with a gentle internal shimmer. */
  vec2 mk = vec2(0.0);
  if (u_mark.z > 0.0) {
    vec2 muv = (frag - u_mark.xy) / u_mark.zw;
    if (muv.x > 0.0 && muv.x < 1.0 && muv.y > 0.0 && muv.y < 1.0)
      mk = texture(u_markTex, vec2(muv.x, 1.0 - muv.y)).rg;
  }
  float inMark = mk.r + mk.g;
  float inHost = mk.g;
  float markV = 0.78 + 0.22 * vnoise(cid * 0.22 + vec2(t * 0.05, -t * 0.04));
  v = mix(v, markV, inMark);

  float vis  = smoothstep(0.36, 0.60, v);
  float peak = smoothstep(0.72, 0.94, v);
  float h = hash21(cid * 1.31 + 7.7);
  int idx = clamp(
    1 + int(floor((h * 0.6 + v * 0.5) * float(u_atlasN - 1))),
    1, u_atlasN - 1);

  vec3 col = mix(u_colBase, u_colPeak, peak);
  col = mix(col, mix(u_colBase, u_colPeak, 0.45 + 0.55 * peak), inMark);
  col = mix(col, u_colGlod, inHost);

  float fadeUp = smoothstep(0.02 * u_res.y, 0.40 * u_res.y, frag.y);
  float a = texture(u_atlas,
      vec2((float(idx) + cuv.x) / float(u_atlasN), 1.0 - cuv.y)).r;
  float tw = 0.86 + 0.14 * vnoise(cid * 0.31 + vec2(t * 0.50, t * 0.34));
  float alpha = a * (((vis * 0.34 + peak * 0.46) * tw) * fadeUp
                     + inMark * 0.85);

  fragColor = vec4(col * alpha, alpha);   // premultiplied
}`;

const COL = {
  base: [0.42, 0.38, 0.36],
  peak: [0.96, 0.94, 0.93],
  glod: [1.0, 0.357, 0.122],
};

function drawGlyphProbe(ch, font) {
  const c = document.createElement("canvas");
  c.width = c.height = 32;
  const x = c.getContext("2d", { willReadFrequently: true });
  x.font = font;
  x.textAlign = "center";
  x.textBaseline = "middle";
  x.fillStyle = "#fff";
  x.fillText(ch, 16, 17);
  return x.getImageData(0, 0, 32, 32).data.join(",");
}

function resolveGlyphSet() {
  const set = [...GLYPHS];
  try {
    const font = `500 44px ${MONO}`;
    const tofu = drawGlyphProbe("\u{10FFFE}", font);
    for (const [slot, rune] of RUNE_SLOTS) {
      const img = drawGlyphProbe(rune, font);
      if (img !== tofu && img !== drawGlyphProbe(" ", font)) set[slot] = rune;
    }
  } catch { /* keep latin set */ }
  return set;
}

function makeAtlas(gl) {
  const set = resolveGlyphSet();
  const T = 64;
  const c = document.createElement("canvas");
  c.width = set.length * T;
  c.height = T;
  const x = c.getContext("2d");
  x.font = `500 46px ${MONO}`;
  x.textAlign = "center";
  x.textBaseline = "middle";
  x.fillStyle = "#fff";
  set.forEach((g, i) => x.fillText(g, i * T + T / 2, T * 0.54));

  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, gl.RED, gl.UNSIGNED_BYTE, c);
  return tex;
}

function compile(gl, type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(sh) || "shader compile failed");
  return sh;
}

const TIME = 8.5; // fixed snapshot instant — clouds developed, deterministic

function paint() {
  const canvas = document.getElementById("field");
  const gl = canvas.getContext("webgl2", {
    alpha: true, antialias: false, depth: false, stencil: false,
    powerPreference: "low-power",
  });
  if (!gl) return; // CSS wash alone is the fallback
  const dpr = Math.floor(Math.min(devicePixelRatio || 1, DPR_MAX) * 4) / 4 || 1;
  const r = document.body.getBoundingClientRect();
  canvas.width = Math.round(r.width * dpr);
  canvas.height = Math.round(r.height * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);

  const program = gl.createProgram();
  gl.attachShader(program, compile(gl, gl.VERTEX_SHADER, VERT));
  gl.attachShader(program, compile(gl, gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS))
    throw new Error(gl.getProgramInfoLog(program) || "link failed");
  gl.useProgram(program);

  const U = (n) => gl.getUniformLocation(program, n);
  gl.uniform2f(U("u_res"), canvas.width, canvas.height);
  gl.uniform1f(U("u_cell"), Math.round(CELL * dpr));
  gl.activeTexture(gl.TEXTURE0);
  makeAtlas(gl);
  gl.uniform1i(U("u_atlas"), 0);
  gl.uniform1i(U("u_atlasN"), GLYPHS.length);
  gl.uniform3fv(U("u_colBase"), COL.base);
  gl.uniform3fv(U("u_colPeak"), COL.peak);
  gl.uniform3fv(U("u_colGlod"), COL.glod);

  gl.uniform4f(U("u_mark"), 0, 0, 0, 0); // clouds only; crisp mark is the SVG

  gl.uniform1f(U("u_time"), TIME);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

paint();
</script>
</body>
</html>
