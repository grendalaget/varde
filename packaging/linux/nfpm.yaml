name: p2pgames
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Arne Molland and p2pgames contributors
description: Peer-hosted game servers for groups of friends.
license: MIT
contents:
  - src: dist/p2pgames-agent
    dst: /usr/bin/p2pgames-agent
    file_info:
      mode: 0755
  - src: dist/p2pgames-mesh
    dst: /usr/lib/p2pgames/p2pgames-mesh
    file_info:
      mode: 0755
  - src: packaging/linux/p2pgames-agent.service
    dst: /usr/lib/systemd/system/p2pgames-agent.service
    type: config
    file_info:
      mode: 0644
  - dst: /etc/p2pgames
    type: dir
  - dst: /var/lib/p2pgames
    type: dir
    file_info:
      mode: 0700
overrides:
  deb:
    depends:
      - systemd
  rpm:
    depends:
      - systemd
scripts:
  postinstall: |
    systemctl daemon-reload || true
    systemctl enable --now p2pgames-agent.service || true
  preremove: |
    systemctl disable --now p2pgames-agent.service || true
  postremove: |
    systemctl daemon-reload || true
