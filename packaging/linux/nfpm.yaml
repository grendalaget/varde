name: varde-agent
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Arne Molland and varde contributors
description: Peer-hosted game servers for groups of friends.
license: MIT
contents:
  - src: dist/varde-agent
    dst: /usr/bin/varde-agent
    file_info:
      mode: 0755
  - src: dist/varde-mesh
    dst: /usr/lib/varde/varde-mesh
    file_info:
      mode: 0755
  - src: packaging/linux/varde-agent.service
    dst: /usr/lib/systemd/system/varde-agent.service
    type: config
    file_info:
      mode: 0644
  - dst: /etc/varde
    type: dir
  - dst: /var/lib/varde
    type: dir
    file_info:
      mode: 0700
overrides:
  deb:
    depends:
      - systemd
  rpm:
    depends:
      - systemd
scripts:
  postinstall: |
    getent passwd varde >/dev/null || useradd --system --home-dir /var/lib/varde --shell /usr/sbin/nologin varde
    systemctl daemon-reload || true
    systemctl enable --now varde-agent.service || true
  preremove: |
    systemctl disable --now varde-agent.service || true
  postremove: |
    systemctl daemon-reload || true
