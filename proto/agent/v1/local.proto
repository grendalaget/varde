// Local IPC between the agent (server, runs as the OS service) and desktop
// clients such as the tray (client, runs in the user's session).
//
// Typed, read-mostly operations only: status plus linking this machine to a
// group. Never a generic command channel (invariant I9). Transport: named
// pipe \\.\pipe\varde-agent on Windows (SYSTEM/Administrators full,
// interactive users read/write), <data>/run/agent.sock on Unix.
syntax = "proto3";

package varde.agent.v1;

option go_package = "github.com/grendalaget/varde/go/gen/agent/v1;agentv1";

service LocalService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  // Streams the current status, then every change.
  rpc WatchStatus(WatchStatusRequest) returns (stream WatchStatusResponse);
  // Starts the device-code flow against control_plane_url. The code shows up
  // in Status.link; the agent polls for approval and starts by itself.
  rpc StartLink(StartLinkRequest) returns (StartLinkResponse);
  rpc CancelLink(CancelLinkRequest) returns (CancelLinkResponse);
  // Re-runs the update check now instead of waiting for the interval.
  rpc CheckUpdate(CheckUpdateRequest) returns (CheckUpdateResponse);
  // Hands a crash report captured by the client (e.g. the tray) to the
  // agent, which stores and uploads it like its own. Any local user may
  // submit; the agent is the only process that can write the crash dir.
  rpc SubmitCrashReport(SubmitCrashReportRequest) returns (SubmitCrashReportResponse);
  // Turns crash-report upload on or off (persisted on the machine).
  rpc SetCrashReporting(SetCrashReportingRequest) returns (SetCrashReportingResponse);
}

enum State {
  STATE_UNSPECIFIED = 0;
  // No config.toml yet: idle, waiting to be linked.
  STATE_NOT_LINKED = 1;
  // A device code is waiting for approval in the dashboard.
  STATE_LINKING = 2;
  // Linked, no successful heartbeat yet.
  STATE_CONNECTING = 3;
  STATE_ONLINE = 4;
  // Linked, but the control plane hasn't answered recently.
  STATE_OFFLINE = 5;
  STATE_SHUTTING_DOWN = 6;
}

message Link {
  string user_code = 1;
  // <control plane>/link?code=<user_code>, built from the URL the user gave.
  string link_url = 2;
  int64 expires_at_unix_ms = 3;
  // An administrator started this as a re-link; only an administrator may
  // cancel it.
  bool relink = 4;
}

// A machine holding a ready copy of the latest committed save.
message SaveHolder {
  string node_name = 1;
  bool anchor = 2;
  // Heartbeats flowing: the copy can be served right now; false means the
  // machine has it but is offline.
  bool online = 3;
  // When the holder last heartbeat, per the control plane (0 = unknown).
  int64 last_seen_at_unix_ms = 4;
}

message Hosting {
  string server_id = 1;
  string server_name = 2;
  // preparing | restoring | starting | running | stopping
  string phase = 3;
  // Latest committed snapshot of the server; 0 when there is none yet.
  int64 latest_safe_save_at_unix_ms = 4;
  // Latest save this PC made in this execution, safe or not (it may not be
  // on enough PCs yet); 0 when there is none.
  int64 latest_save_at_unix_ms = 5;
  // Machines holding the latest committed save, per the control plane.
  repeated SaveHolder latest_safe_save_on = 6;
  // Machines holding the newest save of any state (it may still be
  // replicating), per the control plane.
  repeated SaveHolder latest_save_on = 7;
}

message Update {
  // When the manifest was last fetched; 0 = never checked.
  int64 checked_at_unix_ms = 1;
  // Newer version offered by the feed; empty = up to date (or unknown).
  string available_version = 2;
  // Download URL + minisign signature for this install's own package; empty
  // when the feed signs no entry for it — the update is then notify-only.
  string url = 3;
  string signature = 4;
  // Why the last check or verification failed; empty when fine.
  string error = 5;
}

message Status {
  State state = 1;
  string control_plane_url = 2;
  string group_id = 3;
  string group_name = 4;
  string node_id = 5;
  string node_name = 6;
  int64 last_contact_unix_ms = 7;
  // Set while state == STATE_LINKING.
  Link link = 8;
  // Executions on this machine that haven't finished.
  repeated Hosting hosting = 9;
  // Why the last link attempt failed (expired, unreachable, …); empty if none.
  string link_error = 10;
  string agent_version = 11;
  Update update = 12;
  // Technical form of link_error for the UI's "Additional information"
  // disclosure; empty when there's nothing beyond link_error.
  string link_error_detail = 13;
  // Whether crash reports captured on this machine are uploaded to the
  // control plane. Capture to disk happens either way.
  bool crash_reporting = 14;
}

message GetStatusRequest {}

message GetStatusResponse {
  Status status = 1;
}

message WatchStatusRequest {}

message WatchStatusResponse {
  Status status = 1;
}

message StartLinkRequest {
  string control_plane_url = 1;
  // Required when this machine is already linked. Only Administrators may
  // re-link, and never while the machine hosts a server.
  bool relink = 2;
}

message StartLinkResponse {
  Status status = 1;
}

message CancelLinkRequest {}

message CancelLinkResponse {
  Status status = 1;
}

message CheckUpdateRequest {}

message CheckUpdateResponse {
  Status status = 1;
}

// One crash on this machine. `dump` carries a minidump when present —
// senders must cap it (crash_report::MAX_DUMP_BYTES); larger files stay
// local and detail says why.
message CrashReportMsg {
  // panic | dump | process
  string kind = 1;
  // Image that crashed ("varde-tray").
  string exe = 2;
  string version = 3;
  int32 pid = 4;
  string message = 5;
  string location = 6;
  string backtrace = 7;
  // Extra context: exit code, stderr tail, why a dump is missing.
  string detail = 8;
  int64 created_at_unix_ms = 9;
  bytes dump = 10;
  string dump_name = 11;
}

message SubmitCrashReportRequest {
  CrashReportMsg report = 1;
}

message SubmitCrashReportResponse {}

message SetCrashReportingRequest {
  bool enabled = 1;
}

message SetCrashReportingResponse {
  Status status = 1;
}
